name: wpmcp-e2e
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp
  WORDPRESS_DB_NAME: wp
  # Local environment: plain HTTP and Application Passwords work. Under
  # WP_DEBUG (web container only), PHP errors go to the container log instead
  # of into JSON responses.
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    if ( WP_DEBUG ) { define( 'WP_DEBUG_DISPLAY', false ); define( 'WP_DEBUG_LOG', '/dev/stderr' ); }
x-plugin-mount: &plugin-mount
  type: bind
  source: ${PLUGIN_DIR:-../..}
  target: /var/www/html/wp-content/plugins/wp-mcp-connector
  read_only: true
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8090:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp:/var/www/html
      - *plugin-mount
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on: [wordpress]
    environment: *wp-env
    volumes:
      - wp:/var/www/html
      - *plugin-mount
    entrypoint: ["wp"]
volumes:
  wp:
